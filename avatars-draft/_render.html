<!DOCTYPE html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#888;display:flex;flex-direction:column;gap:24px;padding:24px}
.av{width:512px;height:512px}
</style></head><body>

<!-- 1. Доктор Sonyboy — кассета, катушки-узлы, три ветки мультирепов -->
<svg class="av" id="a1" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <circle cx="256" cy="256" r="248" fill="#EAE9E7" stroke="#0D0D0D" stroke-width="10"/>
  <g transform="translate(0,-16)">
  <!-- корпус кассеты -->
  <rect x="86" y="150" width="340" height="214" rx="22" fill="#fff" stroke="#0D0D0D" stroke-width="12"/>
  <!-- жёлтая наклейка -->
  <rect x="112" y="176" width="288" height="66" rx="10" fill="#FED000" stroke="#0D0D0D" stroke-width="9"/>
  <line x1="136" y1="199" x2="330" y2="199" stroke="#0D0D0D" stroke-width="9" stroke-linecap="round"/>
  <line x1="136" y1="221" x2="272" y2="221" stroke="#0D0D0D" stroke-width="9" stroke-linecap="round"/>
  <!-- окно с катушками -->
  <rect x="126" y="262" width="260" height="76" rx="12" fill="#EAE9E7" stroke="#0D0D0D" stroke-width="9"/>
  <g stroke="#0D0D0D" stroke-width="9" fill="none">
    <circle cx="184" cy="300" r="26" fill="#fff"/><circle cx="328" cy="300" r="26" fill="#fff"/>
    <line x1="210" y1="300" x2="302" y2="300"/>
  </g>
  <circle cx="184" cy="300" r="7" fill="#0D0D0D"/><circle cx="328" cy="300" r="7" fill="#0D0D0D"/>
  <!-- мультирепы: один узел ветвится в три -->
  <g stroke="#0D0D0D" stroke-width="10" fill="none" stroke-linecap="round">
    <path d="M256 364 v22"/>
    <path d="M156 424 v-14 h200 v14"/>
    <path d="M256 386 v24"/>
  </g>
  <circle cx="156" cy="436" r="15" fill="#0D0D0D"/>
  <circle cx="256" cy="436" r="15" fill="#0D0D0D"/>
  <circle cx="356" cy="436" r="15" fill="#0D0D0D"/>
  </g>
</svg>

<!-- 2. Доктор AI болит — голова-робот с молнией, гантель -->
<svg class="av" id="a2" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <circle cx="256" cy="256" r="248" fill="#EAE9E7" stroke="#0D0D0D" stroke-width="10"/>
  <!-- антенна -->
  <line x1="256" y1="112" x2="256" y2="146" stroke="#0D0D0D" stroke-width="12" stroke-linecap="round"/>
  <circle cx="256" cy="100" r="18" fill="#F84D15" stroke="#0D0D0D" stroke-width="10"/>
  <!-- голова -->
  <rect x="112" y="146" width="288" height="210" rx="40" fill="#fff" stroke="#0D0D0D" stroke-width="12"/>
  <!-- молния «болит» на лбу -->
  <path d="M280 176 l-52 54 h34 l-22 40 60 -62 h-36 z" fill="#F84D15" stroke="#0D0D0D" stroke-width="7" stroke-linejoin="round"/>
  <!-- глаза -->
  <rect x="152" y="284" width="72" height="30" rx="15" fill="#0D0D0D"/>
  <rect x="288" y="284" width="72" height="30" rx="15" fill="#0D0D0D"/>
  <!-- рот -->
  <path d="M198 344 q58 -24 116 0" fill="none" stroke="#0D0D0D" stroke-width="11" stroke-linecap="round"/>
  <!-- гантель: Unicorn Gym -->
  <g stroke="#0D0D0D" stroke-width="12" stroke-linecap="round">
    <line x1="176" y1="412" x2="336" y2="412"/>
  </g>
  <rect x="126" y="382" width="42" height="60" rx="12" fill="#0D0D0D"/>
  <rect x="344" y="382" width="42" height="60" rx="12" fill="#0D0D0D"/>
  <rect x="176" y="392" width="26" height="40" rx="9" fill="#fff" stroke="#0D0D0D" stroke-width="10"/>
  <rect x="310" y="392" width="26" height="40" rx="9" fill="#fff" stroke="#0D0D0D" stroke-width="10"/>
</svg>

<!-- 3. Доктор Тринити — очки с цифровым дождём, три кольца -->
<svg class="av" id="a3" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <circle cx="256" cy="256" r="248" fill="#EAE9E7" stroke="#0D0D0D" stroke-width="10"/>
  <defs>
    <clipPath id="lensL"><rect x="86" y="160" width="150" height="104" rx="22"/></clipPath>
    <clipPath id="lensR"><rect x="276" y="160" width="150" height="104" rx="22"/></clipPath>
  </defs>
  <!-- дужки -->
  <path d="M86 190 h-34 M426 190 h34" stroke="#0D0D0D" stroke-width="14" stroke-linecap="round"/>
  <line x1="236" y1="196" x2="276" y2="196" stroke="#0D0D0D" stroke-width="14"/>
  <!-- линзы -->
  <rect x="86" y="160" width="150" height="104" rx="22" fill="#0D0D0D"/>
  <rect x="276" y="160" width="150" height="104" rx="22" fill="#0D0D0D"/>
  <!-- цифровой дождь внутри линз -->
  <g clip-path="url(#lensL)" stroke="#47BAD5" stroke-width="9" stroke-linecap="round">
    <line x1="112" y1="168" x2="112" y2="214"/><line x1="140" y1="186" x2="140" y2="256"/>
    <line x1="168" y1="164" x2="168" y2="200"/><line x1="196" y1="196" x2="196" y2="252"/>
    <line x1="224" y1="172" x2="224" y2="222"/>
  </g>
  <g clip-path="url(#lensR)" stroke="#47BAD5" stroke-width="9" stroke-linecap="round">
    <line x1="300" y1="180" x2="300" y2="248"/><line x1="328" y1="164" x2="328" y2="206"/>
    <line x1="356" y1="192" x2="356" y2="256"/><line x1="384" y1="168" x2="384" y2="212"/>
    <line x1="412" y1="188" x2="412" y2="238"/>
  </g>
  <rect x="86" y="160" width="150" height="104" rx="22" fill="none" stroke="#0D0D0D" stroke-width="12"/>
  <rect x="276" y="160" width="150" height="104" rx="22" fill="none" stroke="#0D0D0D" stroke-width="12"/>
  <!-- три кольца -->
  <g fill="none" stroke="#0D0D0D" stroke-width="14">
    <circle cx="216" cy="408" r="42"/><circle cx="296" cy="408" r="42"/><circle cx="256" cy="344" r="42"/>
  </g>
</svg>

</body></html>
