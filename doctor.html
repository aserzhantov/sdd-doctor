<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0D0D0D">
<meta name="robots" content="noindex">
<title>Кабинет SDD-доктора</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body class="tool">

<header class="top" id="hdr"></header>

<div class="wrap">
  <div class="banner hidden" id="banner"></div>
  <div id="root"><div class="skel"></div></div>

  <footer><div id="clock"></div></footer>
</div>

<script src="config.js"></script>
<script src="assets/app.js"></script>
<script src="assets/mock.js"></script>
<script>
/* ---------------------------------------------------------------------------
 * Кабинет доктора. Сценарий 2 в specs/10-flows.md
 * Доступ по секретной ссылке: doctor.html?doc=<id>&t=<token>
 * ------------------------------------------------------------------------- */

const DOC_ID = App.qs('doc');
const TOKEN  = App.qs('t');

let DOCTOR = null;
let ROWS = [];
let FEEDBACK = [];
let TAB = 'plan';
let lastOk = null;

const $ = (id) => document.getElementById(id);

function deny(msg) {
  $('root').innerHTML = `<div class="notice">${App.esc(msg)}</div>`;
}

async function load() {
  if (!DOC_ID || !TOKEN) return deny('Ссылка неполная. Обратитесь к организатору.');

  try {
    // Карточка доктора берётся из публичной view — там нет ПДн, токен не нужен.
    if (!DOCTOR) {
      const docs = await App.select('v_doctors', `select=*&id=eq.${encodeURIComponent(DOC_ID)}`);
      DOCTOR = (docs && docs[0]) || null;
    }
    // Отзывы грузим вместе с расписанием: отдельный запрос при переключении
    // вкладки давал бы пустой экран на секунду при плохой связи в зале.
    [ROWS, FEEDBACK] = await Promise.all([
      App.rpc('doctor_bookings', { p_doctor_id: DOC_ID, p_token: TOKEN }),
      App.rpc('doctor_feedback', { p_doctor_id: DOC_ID, p_token: TOKEN }).catch(() => []),
    ]);
    lastOk = new Date();
    $('banner').classList.add('hidden');
    render();
  } catch (e) {
    if (e.code === 'P0001') return deny('Ссылка недействительна. Обратитесь к организатору.');
    // Сеть отвалилась — оставляем на экране последние успешные данные.
    if (lastOk) {
      $('banner').classList.remove('hidden');
      $('banner').textContent = `Нет связи. Данные актуальны на ${App.fmtTime(lastOk)}.`;
    } else {
      deny('Не удалось загрузить данные. Проверьте связь и обновите страницу.');
    }
  }
}

function render() {
  if (!DOCTOR) return deny('Доктор не найден или выключен организатором.');

  const now   = new Date();
  const slots = App.slotsFor(DOCTOR);
  const occ   = App.occupancyMap(ROWS.map(r => ({ ...r, doctor_id: DOC_ID })), DOC_ID);
  const off   = App.offGrid(ROWS, slots);

  const guests = ROWS.filter(r => r.kind === 'participant');
  const avg = FEEDBACK.length
    ? (FEEDBACK.reduce((s, f) => s + f.rating, 0) / FEEDBACK.length).toFixed(1)
    : null;
  const cur  = slots.find(s => s.start <= now && now < s.end && occ.get(s.key)?.kind === 'participant');
  const next = slots.find(s => s.start > now && occ.get(s.key)?.kind === 'participant');

  const card = (label, slot, empty) => {
    const rec = slot ? occ.get(slot.key) : null;
    // Время стоит рядом с меткой, а не в хвосте темы: тема бывает
    // в 120 символов, и время в её конце читалось как часть фразы.
    return `<div class="now-card ${rec ? 'active' : ''}" style="margin-bottom:var(--gap)">
      <div class="label">
        <span>${label}</span>
        ${rec ? `<span class="when">${App.fmtTime(slot.start)}–${App.fmtTime(slot.end)}</span>` : ''}
      </div>
      <div class="big">${rec ? App.esc(rec.role) : empty}</div>
      ${rec && rec.topic ? `<div class="sub">${App.esc(rec.topic)}</div>` : ''}
      ${rec && label === 'Сейчас' ? `<div class="sub" style="color:var(--yellow);margin-top:8px">
        в конце приёма попросите оценить визит — QR на столе тот же
      </div>` : ''}
    </div>`;
  };

  $('root').innerHTML = `
    <div class="row-between" style="margin:18px 0 16px">
      <div class="slot-head" style="margin:0">
        <div>
          <div style="font-size:20px;font-weight:800">${App.esc(DOCTOR.alias)}</div>
          ${DOCTOR.role ? `<div style="color:var(--muted);font-size:13px">${App.esc(DOCTOR.role)}</div>` : ''}
          <div style="color:var(--muted);font-size:13px">
            ${DOCTOR.table_no ? 'Стол №' + App.esc(DOCTOR.table_no) + ' · ' : ''}
            сегодня приёмов: <b>${guests.length}</b>
            ${avg ? ` · рейтинг <b style="color:var(--yellow)">★ ${avg}</b>
                     <span style="color:var(--faint)">(${App.esc(App.plural(FEEDBACK.length, 'отзыв', 'отзыва', 'отзывов'))})</span>` : ''}
          </div>
        </div>
      </div>
      <button class="btn ghost sm" id="btnReload">Обновить</button>
    </div>

    <div class="tabs">
      <button id="tPlan" class="${TAB === 'plan' ? 'active' : ''}">Расписание</button>
      <button id="tFb"   class="${TAB === 'fb'   ? 'active' : ''}">Отзывы (${FEEDBACK.length})</button>
    </div>

    ${TAB === 'fb' ? renderFeedback() : `
    ${card('Сейчас', cur, 'Свободно')}
    ${card('Следующий', next, 'Больше записей нет')}

    <div class="card">
      <h3>Расписание на день</h3>
      ${slots.map(s => {
        const rec = occ.get(s.key);
        const past = s.end <= now;
        const kind = rec ? rec.kind : 'free';
        let right = '';
        if (kind === 'free' && !past) {
          right = `<button class="btn ghost sm" data-block="${s.key}">Заблокировать</button>`;
        } else if (kind === 'blocked') {
          right = `<button class="btn ghost sm" data-unblock="${s.key}">Освободить</button>`;
        }
        const who = kind === 'participant'
          ? `<div><b>${App.esc(rec.role)}</b></div><div class="sm">${App.esc(rec.topic)}</div>`
          : kind === 'blocked'
            ? `<div style="color:var(--muted)">Заблокировано</div>`
            : `<div style="color:var(--faint)">Свободно</div>`;
        return `<div class="line-item ${past ? 'is-past' : ''}">
          <div class="t">${App.fmtTime(s.start)}</div>
          <div class="n">${who}</div>
          ${right}
        </div>`;
      }).join('')}
    </div>

    ${off.length ? `<div class="card">
      <h3>Вне текущей сетки</h3>
      <div style="color:var(--muted);font-size:13px;margin-bottom:10px">
        Эти записи сделаны при другой длительности приёма. Организатор может удалить их в админке.
      </div>
      ${off.map(r => `<div class="line-item">
        <div class="t">${App.fmtTime(new Date(r.slot_start))}</div>
        <div class="n"><b>${App.esc(r.role || '—')}</b><div class="sm">${App.esc(r.topic || '')}</div></div>
      </div>`).join('')}
    </div>` : ''}`}`;

  $('btnReload').onclick = load;
  $('tPlan').onclick = () => { TAB = 'plan'; render(); };
  $('tFb').onclick   = () => { TAB = 'fb';   render(); };
  document.querySelectorAll('[data-block]').forEach(b =>
    b.onclick = () => setBlock(Number(b.dataset.block), true));
  document.querySelectorAll('[data-unblock]').forEach(b =>
    b.onclick = () => setBlock(Number(b.dataset.unblock), false));
}

/* Лента отзывов. Привязка к слоту и к тому, что писал участник, здесь есть
 * сознательно — доктору она нужна, чтобы вспомнить разговор. Участника об этом
 * честно предупреждают в форме, см. specs/60-backlog.md. */
function renderFeedback() {
  if (!FEEDBACK.length) {
    return `<div class="empty">
      <img src="assets/unicorn.png" alt="" onerror="this.remove()">
      <div class="t">Отзывов пока нет</div>
      <div class="s">попросите оценить визит в конце приёма — QR на столе тот же</div>
    </div>`;
  }

  const stars = (n) => `<span style="color:var(--yellow);letter-spacing:2px">${'★'.repeat(n)}</span>` +
                       `<span style="color:var(--off);letter-spacing:2px">${'★'.repeat(5 - n)}</span>`;

  return `<div class="card">
    <h3>Отзывы</h3>
    ${FEEDBACK.map(f => `<div class="line-item" style="align-items:flex-start">
      <div class="t">${App.fmtTime(new Date(f.slot_start))}</div>
      <div class="n">
        <div style="font-size:15px">${stars(f.rating)}</div>
        <div class="sm" style="margin-top:2px">
          ${App.esc(f.role || '—')}${f.topic ? ' · ' + App.esc(f.topic) : ''}
        </div>
        ${f.useful ? `<div style="margin-top:8px"><b>Полезное:</b> ${App.esc(f.useful)}</div>` : ''}
        ${f.improve ? `<div style="margin-top:4px;color:var(--muted)"><b>Улучшить:</b> ${App.esc(f.improve)}</div>` : ''}
      </div>
    </div>`).join('')}
  </div>`;
}

async function setBlock(key, blocked) {
  try {
    await App.rpc('doctor_block_slot', {
      p_doctor_id:  DOC_ID,
      p_slot_start: new Date(key).toISOString(),
      p_token:      TOKEN,
      p_blocked:    blocked,
    });
    App.toast(blocked ? 'Слот заблокирован' : 'Слот освобождён', 'ok');
    load();
  } catch (e) {
    App.toast(App.errText(e), 'err');
    load();
  }
}

function tickClock() { $('clock').textContent = 'Время по Москве · ' + App.fmtTime(new Date()); }

App.renderHeader($('hdr'), 'Кабинет доктора', 'sdd-day/doctors/schedule.md');
tickClock();
setInterval(tickClock, 30000);
load();
setInterval(() => { if (!document.hidden) load(); }, 30000);
</script>
</body>
</html>
